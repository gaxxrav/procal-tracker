<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch and home
         indicator; the safe-area padding in index.css keeps content clear. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>procal · calorie &amp; protein tracker</title>
    <meta name="description" content="Log food, lifts and bodyweight against daily targets." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS home-screen app: without apple-touch-icon iOS uses a screenshot,
         and without mobile-web-app-capable it opens in Safari with chrome. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="procal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Matches the app surface in each mode so the iOS status bar and the
         Android address bar don't flash the wrong colour. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
